name: Build PicoOS cheatsheet PDF

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build cheatsheet PDF
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"

      - name: Build PDF
        run: make build-pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: picoos-cheatsheet
          path: picoos-cheatsheet.pdf
          if-no-files-found: error

  release:
    name: Publish GitHub Release for version tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: picoos-cheatsheet
          path: release

      - uses: softprops/action-gh-release@v3
        with:
          files: release/picoos-cheatsheet.pdf
